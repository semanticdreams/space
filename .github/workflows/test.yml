name: test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      SKIP_KEYRING_TESTS: 1
      XDG_DATA_HOME: /tmp/space/tests/xdg-data
      SPACE_DISABLE_AUDIO: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-linux-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'scripts/build-linux.sh', 'scripts/build-appimage.sh', 'Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-linux-${{ github.ref }}-
            ccache-${{ runner.os }}-linux-
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          deps=$(awk '/CI_DEPS_START/{flag=1;next}/CI_DEPS_END/{flag=0}flag' README.md | sed -n 's/^sudo apt install //p')
          sudo apt-get install -y ${deps} xvfb ccache

      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: make build

      - name: ccache stats
        run: ccache -s

      - name: Run test suite
        env:
          SPACE_ASSETS_PATH: ${{ github.workspace }}/assets
        run: ctest --test-dir build --output-on-failure -V

      - name: Run e2e test suite
        run: make test-e2e

  test-windows:
    runs-on: windows-latest
    env:
      SKIP_KEYRING_TESTS: 1
      SPACE_DISABLE_AUDIO: 1
      SPACE_MATRIX_TEST: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache-windows
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache-windows
          key: ccache-${{ runner.os }}-windows-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'scripts/build-windows.sh', 'scripts/prepare-windows-runtime.sh', '.github/workflows/test.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-windows-${{ github.ref }}-
            ccache-${{ runner.os }}-windows-
            ccache-${{ runner.os }}-

      - name: Setup Windows MinGW toolchain
        uses: ./.github/actions/setup-windows-mingw
        with:
          vcpkg-root: ${{ github.workspace }}/vcpkg

      - name: Build Windows target
        shell: msys2 {0}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_TARGET_TRIPLET: x64-mingw-dynamic-posix
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/build-windows.sh

      - name: Prepare runtime
        shell: msys2 {0}
        run: scripts/prepare-windows-runtime.sh build/windows/space.exe

      - name: Run Windows fast suite
        shell: msys2 {0}
        env:
          SPACE_ASSETS_PATH: ${{ github.workspace }}/assets
          FENNEL_PATH: ${{ github.workspace }}/assets/lua/?.fnl;${{ github.workspace }}/assets/lua/?/init.fnl
          FENNEL_MACRO_PATH: ${{ github.workspace }}/assets/lua/?.fnl;${{ github.workspace }}/assets/lua/?/init.fnl
          XDG_DATA_HOME: ${{ github.workspace }}/.tmp/xdg-data
        run: build/windows/space.exe -m tests.fast:main

      - name: ccache stats
        shell: msys2 {0}
        run: ccache -s
