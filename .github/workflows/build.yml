name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SPACE_RELEASE_HEADLESS_SMOKE_MODULE: tests.test-headless-engine-run:main
  SPACE_RELEASE_CEF_SMOKE_MODULE: tests.test-cef-browser-smoke:main

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            stable_appimage: space-linux-x86_64.AppImage
          - profile: minimal
            stable_appimage: space-minimal-linux-x86_64.AppImage
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-linux-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'scripts/build-linux.sh', 'scripts/build-appimage.sh', 'Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-linux-${{ github.ref }}-
            ccache-${{ runner.os }}-linux-
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          deps=$(awk '/CI_DEPS_START/{flag=1;next}/CI_DEPS_END/{flag=0}flag' README.md | sed -n 's/^sudo apt install //p')
          sudo apt-get install -y ${deps} ccache rpm

      - name: Configure and Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/build-linux.sh --profile ${{ matrix.profile }} --package-mode appimage

      - name: Smoke test Linux bundles (host)
        run: |
          appimage="$(realpath "build/${{ matrix.stable_appimage }}")"
          test -n "${appimage}"
          test -f "${appimage}"
          chmod +x "${appimage}"
          if [[ "${{ matrix.profile }}" == "full" ]]; then
            Xvfb :99 -screen 0 1024x768x24 >/tmp/space-xvfb.log 2>&1 &
            xvfb_pid="$!"
            trap 'kill "${xvfb_pid}"' EXIT
            sleep 1
            timeout 30s env DISPLAY=:99 SPACE_DISABLE_AUDIO=1 APPIMAGE_EXTRACT_AND_RUN=1 \
              "${appimage}" -m "${SPACE_RELEASE_CEF_SMOKE_MODULE}"
            kill "${xvfb_pid}"
            trap - EXIT
          else
            timeout 30s env SPACE_DISABLE_AUDIO=1 SPACE_SKIP_CEF=1 APPIMAGE_EXTRACT_AND_RUN=1 \
              "${appimage}" -m "${SPACE_RELEASE_HEADLESS_SMOKE_MODULE}"
          fi
          rm -rf /tmp/space-appimage-smoke
          mkdir -p /tmp/space-appimage-smoke
          (
            cd /tmp/space-appimage-smoke
            "${appimage}" --appimage-extract >/dev/null
            test -x squashfs-root/AppRun
            test -x squashfs-root/usr/bin/space
            test -f squashfs-root/usr/share/space/assets/lua/main.fnl
            if [[ "${{ matrix.profile }}" == "full" ]]; then
              test -x squashfs-root/usr/bin/space_cef_helper
              test -f squashfs-root/usr/lib/space/cef/libcef.so
              test -f squashfs-root/usr/lib/space/cef/libEGL.so
              test -f squashfs-root/usr/lib/space/cef/libGLESv2.so
              test -f squashfs-root/usr/lib/space/cef/libvk_swiftshader.so
              test -f squashfs-root/usr/lib/space/cef/libvulkan.so.1
              test -f squashfs-root/usr/lib/space/cef/vk_swiftshader_icd.json
              test -f squashfs-root/usr/lib/space/cef/icudtl.dat
              test -f squashfs-root/usr/lib/space/cef/chrome_100_percent.pak
              test -f squashfs-root/usr/lib/space/cef/chrome_200_percent.pak
              test -f squashfs-root/usr/lib/space/cef/resources.pak
              test -f squashfs-root/usr/lib/space/cef/v8_context_snapshot.bin
              test -d squashfs-root/usr/lib/space/cef/locales
            else
              test ! -e squashfs-root/usr/bin/space_cef_helper
              test ! -e squashfs-root/usr/lib/space/cef
              test ! -e squashfs-root/usr/lib/libcef.so
            fi
          )
          if [[ "${{ matrix.profile }}" == "full" ]]; then
            tarball="$(realpath "build/dist/space-linux-x86_64-bin.tar.gz")"
          else
            tarball="$(realpath "build/dist/space-minimal-linux-x86_64-bin.tar.gz")"
          fi
          test -f "${tarball}"
          rm -rf /tmp/space-tarball-smoke
          mkdir -p /tmp/space-tarball-smoke
          tar -xzf "${tarball}" -C /tmp/space-tarball-smoke
          test -x /tmp/space-tarball-smoke/space
          test -x /tmp/space-tarball-smoke/bin/space
          test -f /tmp/space-tarball-smoke/share/space/assets/lua/main.fnl
          if [[ "${{ matrix.profile }}" == "full" ]]; then
            test -x /tmp/space-tarball-smoke/bin/space_cef_helper
            test -f /tmp/space-tarball-smoke/lib/space/cef/libcef.so
            test -f /tmp/space-tarball-smoke/lib/space/cef/libEGL.so
            test -f /tmp/space-tarball-smoke/lib/space/cef/libGLESv2.so
            test -f /tmp/space-tarball-smoke/lib/space/cef/libvk_swiftshader.so
            test -f /tmp/space-tarball-smoke/lib/space/cef/libvulkan.so.1
            test -f /tmp/space-tarball-smoke/lib/space/cef/vk_swiftshader_icd.json
            test -f /tmp/space-tarball-smoke/lib/space/cef/icudtl.dat
            test -f /tmp/space-tarball-smoke/lib/space/cef/chrome_100_percent.pak
            test -f /tmp/space-tarball-smoke/lib/space/cef/chrome_200_percent.pak
            test -f /tmp/space-tarball-smoke/lib/space/cef/resources.pak
            test -f /tmp/space-tarball-smoke/lib/space/cef/v8_context_snapshot.bin
            test -d /tmp/space-tarball-smoke/lib/space/cef/locales
            Xvfb :99 -screen 0 1024x768x24 >/tmp/space-xvfb.log 2>&1 &
            xvfb_pid="$!"
            trap 'kill "${xvfb_pid}"' EXIT
            sleep 1
            timeout 30s env DISPLAY=:99 SPACE_DISABLE_AUDIO=1 \
              /tmp/space-tarball-smoke/space -m "${SPACE_RELEASE_CEF_SMOKE_MODULE}"
            kill "${xvfb_pid}"
            trap - EXIT
          else
            test ! -e /tmp/space-tarball-smoke/bin/space_cef_helper
            test ! -e /tmp/space-tarball-smoke/lib/space/cef
            test ! -e /tmp/space-tarball-smoke/lib/libcef.so
            timeout 30s env SPACE_DISABLE_AUDIO=1 SPACE_SKIP_CEF=1 \
              /tmp/space-tarball-smoke/space -m "${SPACE_RELEASE_HEADLESS_SMOKE_MODULE}"
          fi

      - name: Smoke test AppImage (Linux distros)
        run: |
          appimage="${{ matrix.stable_appimage }}"
          for image in ubuntu:22.04 ubuntu:24.04 debian:12 debian:13 fedora:43 fedora:44 opensuse/tumbleweed; do
            docker run --rm \
              -e APPIMAGE_NAME="${appimage}" \
              -e PROFILE="${{ matrix.profile }}" \
              -e SPACE_RELEASE_HEADLESS_SMOKE_MODULE="${SPACE_RELEASE_HEADLESS_SMOKE_MODULE}" \
              -e SPACE_RELEASE_CEF_SMOKE_MODULE="${SPACE_RELEASE_CEF_SMOKE_MODULE}" \
              -v "$PWD/build:/work" \
              "${image}" bash -lc '
              set -euo pipefail
              if [[ "${PROFILE}" == "full" ]]; then
                if command -v apt-get >/dev/null 2>&1; then
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update
                  apt-get install -y --no-install-recommends xvfb
                elif command -v dnf >/dev/null 2>&1; then
                  dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb
                elif command -v zypper >/dev/null 2>&1; then
                  zypper -n refresh
                  zypper -n install --no-recommends xorg-x11-server-extra || \
                    zypper -n install --no-recommends xorg-x11-server-Xvfb
                else
                  echo "unsupported package manager for Xvfb smoke" >&2
                  exit 1
                fi
                Xvfb :99 -screen 0 1024x768x24 >/tmp/space-xvfb.log 2>&1 &
                xvfb_pid="$!"
                trap '\''kill "${xvfb_pid}"'\'' EXIT
                sleep 1
                timeout 30s env DISPLAY=:99 SPACE_DISABLE_AUDIO=1 APPIMAGE_EXTRACT_AND_RUN=1 \
                  "/work/${APPIMAGE_NAME}" -m "${SPACE_RELEASE_CEF_SMOKE_MODULE}"
                kill "${xvfb_pid}"
                trap - EXIT
              else
                timeout 30s env SPACE_DISABLE_AUDIO=1 SPACE_SKIP_CEF=1 APPIMAGE_EXTRACT_AND_RUN=1 \
                  "/work/${APPIMAGE_NAME}" -m "${SPACE_RELEASE_HEADLESS_SMOKE_MODULE}"
              fi
              rm -rf /tmp/appimage-check
              mkdir -p /tmp/appimage-check
              cd /tmp/appimage-check
              "/work/${APPIMAGE_NAME}" --appimage-extract >/dev/null
              test -x squashfs-root/AppRun
              test -x squashfs-root/usr/bin/space
              test -f squashfs-root/usr/share/space/assets/lua/main.fnl
              if [[ "${PROFILE}" == "full" ]]; then
                test -x squashfs-root/usr/bin/space_cef_helper
                test -f squashfs-root/usr/lib/space/cef/libcef.so
                test -f squashfs-root/usr/lib/space/cef/libEGL.so
                test -f squashfs-root/usr/lib/space/cef/libGLESv2.so
                test -f squashfs-root/usr/lib/space/cef/libvk_swiftshader.so
                test -f squashfs-root/usr/lib/space/cef/libvulkan.so.1
                test -f squashfs-root/usr/lib/space/cef/vk_swiftshader_icd.json
                test -f squashfs-root/usr/lib/space/cef/icudtl.dat
                test -f squashfs-root/usr/lib/space/cef/chrome_100_percent.pak
                test -f squashfs-root/usr/lib/space/cef/chrome_200_percent.pak
                test -f squashfs-root/usr/lib/space/cef/resources.pak
                test -f squashfs-root/usr/lib/space/cef/v8_context_snapshot.bin
                test -d squashfs-root/usr/lib/space/cef/locales
              else
                test ! -e squashfs-root/usr/bin/space_cef_helper
                test ! -e squashfs-root/usr/lib/space/cef
                test ! -e squashfs-root/usr/lib/libcef.so
              fi
            '
          done

      - name: ccache stats
        run: ccache -s

      - name: Resolve release artifacts
        id: linux-release-artifacts
        run: |
          manifest="build/release-artifacts-${{ matrix.profile }}.txt"
          test -f "${manifest}"
          {
            echo 'files<<EOF'
            cat "${manifest}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Verify release artifacts
        run: |
          manifest="build/release-artifacts-${{ matrix.profile }}.txt"
          test -f "${manifest}"
          while IFS= read -r artifact; do
            test -n "${artifact}"
            test -f "${artifact}"
          done < "${manifest}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ${{ steps.linux-release-artifacts.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            deb_flavor: ubuntu-22.04
            build_image: ubuntu:22.04
            gccjit_package: libgccjit-11-dev
            stable_deb: space-linux-ubuntu-22.04-amd64.deb
          - profile: minimal
            deb_flavor: ubuntu-22.04
            build_image: ubuntu:22.04
            gccjit_package: libgccjit-11-dev
            stable_deb: space-minimal-linux-ubuntu-22.04-amd64.deb
          - profile: full
            deb_flavor: ubuntu-24.04
            build_image: ubuntu:24.04
            gccjit_package: libgccjit-13-dev
            stable_deb: space-linux-ubuntu-24.04-amd64.deb
          - profile: minimal
            deb_flavor: ubuntu-24.04
            build_image: ubuntu:24.04
            gccjit_package: libgccjit-13-dev
            stable_deb: space-minimal-linux-ubuntu-24.04-amd64.deb
          - profile: full
            deb_flavor: debian-12
            build_image: debian:12
            gccjit_package: libgccjit-12-dev
            stable_deb: space-linux-debian-12-amd64.deb
          - profile: minimal
            deb_flavor: debian-12
            build_image: debian:12
            gccjit_package: libgccjit-12-dev
            stable_deb: space-minimal-linux-debian-12-amd64.deb
          - profile: full
            deb_flavor: debian-13
            build_image: debian:13
            gccjit_package: libgccjit-14-dev
            stable_deb: space-linux-debian-13-amd64.deb
          - profile: minimal
            deb_flavor: debian-13
            build_image: debian:13
            gccjit_package: libgccjit-14-dev
            stable_deb: space-minimal-linux-debian-13-amd64.deb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache-deb-${{ matrix.deb_flavor }}
          key: ccache-${{ runner.os }}-deb-${{ matrix.deb_flavor }}-${{ matrix.profile }}-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'scripts/build-linux.sh', 'scripts/build-appimage.sh', 'Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-deb-${{ matrix.deb_flavor }}-${{ matrix.profile }}-${{ github.ref }}-
            ccache-${{ runner.os }}-deb-${{ matrix.deb_flavor }}-${{ matrix.profile }}-
            ccache-${{ runner.os }}-deb-

      - name: Build DEB on distro baseline
        run: |
          docker run --rm \
            -e PROFILE="${{ matrix.profile }}" \
            -e DEB_FLAVOR="${{ matrix.deb_flavor }}" \
            -e GCCJIT_PACKAGE="${{ matrix.gccjit_package }}" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache \
            -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -e CCACHE_DIR="/work/.ccache-deb-${{ matrix.deb_flavor }}" \
            -e CCACHE_MAXSIZE=1G \
            -v "$PWD:/work" \
            -w /work \
            "${{ matrix.build_image }}" \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                cmake \
                g++ \
                make \
                git \
                pkg-config \
                dpkg-dev \
                ccache \
                bzip2 \
                tar \
                libbullet-dev \
                libglm-dev \
                libopenal-dev \
                libepoxy-dev \
                portaudio19-dev \
                libvterm-dev \
                libnotify-dev \
                libcurl4-openssl-dev \
                libzmq3-dev \
                python3 \
                python3-pil \
                python3-zmq \
                cargo \
                libaubio-dev \
                libboost-dev \
                libxapian-dev \
                libtorrent-rasterbar-dev \
                ripgrep \
                ffmpeg \
                libavcodec-dev \
                libavformat-dev \
                libavutil-dev \
                libswscale-dev \
                libswresample-dev \
                "${GCCJIT_PACKAGE}" \
                libsecret-1-dev \
                libwayland-dev \
                libegl1-mesa-dev \
                libgl-dev \
                libxkbcommon-dev \
                libxi-dev \
                libpng-dev \
                libfreetype-dev
              git config --global --add safe.directory /work
              scripts/build-linux.sh \
                --profile "${PROFILE}" \
                --build-dir "build/deb-${DEB_FLAVOR}-${PROFILE}" \
                --package-mode deb \
                --deb-flavor "${DEB_FLAVOR}"
              ccache -s
              chown -R "${HOST_UID}:${HOST_GID}" "build/deb-${DEB_FLAVOR}-${PROFILE}" "${CCACHE_DIR}"
            '

      - name: Smoke test DEB install
        run: |
          docker run --rm \
            -e DEB_NAME="${{ matrix.stable_deb }}" \
            -e PROFILE="${{ matrix.profile }}" \
            -e SPACE_RELEASE_HEADLESS_SMOKE_MODULE="${SPACE_RELEASE_HEADLESS_SMOKE_MODULE}" \
            -e SPACE_RELEASE_CEF_SMOKE_MODULE="${SPACE_RELEASE_CEF_SMOKE_MODULE}" \
            -v "$PWD/build/deb-${{ matrix.deb_flavor }}-${{ matrix.profile }}:/work:ro" \
            "${{ matrix.build_image }}" \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              if [[ "${PROFILE}" == "full" ]]; then
                apt-get install -y --no-install-recommends xvfb
              fi
              apt-get install -y --no-install-recommends "/work/${DEB_NAME}"
              if [[ "${PROFILE}" == "full" ]]; then
                test -x /usr/bin/space_cef_helper
                test -f /usr/lib/space/cef/libcef.so
                test -f /usr/lib/space/cef/libEGL.so
                test -f /usr/lib/space/cef/libGLESv2.so
                test -f /usr/lib/space/cef/libvk_swiftshader.so
                test -f /usr/lib/space/cef/libvulkan.so.1
                test -f /usr/lib/space/cef/vk_swiftshader_icd.json
                test -f /usr/lib/space/cef/icudtl.dat
                test -f /usr/lib/space/cef/chrome_100_percent.pak
                test -f /usr/lib/space/cef/chrome_200_percent.pak
                test -f /usr/lib/space/cef/resources.pak
                test -f /usr/lib/space/cef/v8_context_snapshot.bin
                test -d /usr/lib/space/cef/locales
                Xvfb :99 -screen 0 1024x768x24 >/tmp/space-xvfb.log 2>&1 &
                xvfb_pid="$!"
                trap '\''kill "${xvfb_pid}"'\'' EXIT
                sleep 1
                timeout 30s env DISPLAY=:99 SPACE_DISABLE_AUDIO=1 space -m "${SPACE_RELEASE_CEF_SMOKE_MODULE}"
                kill "${xvfb_pid}"
                trap - EXIT
              else
                test ! -e /usr/bin/space_cef_helper
                test ! -e /usr/lib/space/cef
                test ! -e /usr/lib/libcef.so
                timeout 30s env SPACE_DISABLE_AUDIO=1 SPACE_SKIP_CEF=1 space -m "${SPACE_RELEASE_HEADLESS_SMOKE_MODULE}"
              fi
            '

      - name: Resolve DEB release artifact
        id: deb-release-artifacts
        run: |
          manifest="build/deb-${{ matrix.deb_flavor }}-${{ matrix.profile }}/release-artifacts-${{ matrix.profile }}.txt"
          test -f "${manifest}"
          {
            echo 'files<<EOF'
            cat "${manifest}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Verify DEB release artifact
        run: |
          manifest="build/deb-${{ matrix.deb_flavor }}-${{ matrix.profile }}/release-artifacts-${{ matrix.profile }}.txt"
          test -f "${manifest}"
          while IFS= read -r artifact; do
            test -n "${artifact}"
            test -f "${artifact}"
          done < "${manifest}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ${{ steps.deb-release-artifacts.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-windows
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v5

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache-windows
          key: ccache-${{ runner.os }}-windows-cross-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'apps/space/windows_app.rc.in', 'scripts/build-windows.sh', 'scripts/build-windows-from-linux.sh', 'scripts/setup-windows-build-host.sh', 'scripts/prepare-windows-runtime.sh', 'scripts/prepare-windows-wine-runtime.sh', 'scripts/generate_windows_icon.py', 'scripts/build-windows-installer.py', 'scripts/windows-installer.iss') }}
          restore-keys: |
            ccache-${{ runner.os }}-windows-cross-${{ github.ref }}-
            ccache-${{ runner.os }}-windows-cross-

      - name: Setup Windows cross-build host
        run: scripts/setup-windows-build-host.sh

      - name: Configure and Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/build-windows-from-linux.sh

      - name: Prepare runtime and bundle artifacts
        run: scripts/package-windows-runtime.sh

      - name: Smoke test Windows binary
        run: |
          scripts/prepare-windows-wine-runtime.sh build/windows/space.exe
          test -f build/dist/windows/space.exe
          timeout 60s wine64 build/windows/space.exe --help >/dev/null

      - name: Create ZIP
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path("build/dist/windows")
          with zipfile.ZipFile("build/dist/space-windows.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  archive.write(path, path.relative_to(root))
          PY

      - name: ccache stats
        run: ccache -s

      - name: Upload Windows packaging inputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-packaging-inputs
          path: |
            build/dist/space-windows.zip
            build/dist/windows
            build/windows/CPackConfig.cmake
            build/windows/space.ico
            scripts/windows-installer.iss

  build-windows-installer:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows packaging inputs
        uses: actions/download-artifact@v4
        with:
          name: windows-packaging-inputs
          path: .

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: python scripts/build-windows-installer.py

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "space-install"
          $logPath = Join-Path $env:RUNNER_TEMP "space-installer.log"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          Remove-Item $logPath -ErrorAction SilentlyContinue
          $installer = (Resolve-Path "build/dist/space-windows-setup.exe").Path
          Start-Process -FilePath $installer -ArgumentList @("/SP-","/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/TASKS=desktopicon",("/DIR=" + $installDir),("/LOG=" + $logPath)) -Wait -NoNewWindow
          if (-not (Test-Path (Join-Path $installDir "space.exe"))) {
            if (Test-Path $logPath) {
              Get-Content $logPath
            }
            throw "Installed executable not found."
          }
          & (Join-Path $installDir "space.exe") --help *> $null

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            build/dist/space-windows.zip
            build/dist/space-windows-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-rpm:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            rpm_flavor: fedora
            build_image: fedora:43
            test_targets: fedora:43
            stable_rpm: space-linux-fedora-x86_64.rpm
          - profile: minimal
            rpm_flavor: fedora
            build_image: fedora:43
            test_targets: fedora:43
            stable_rpm: space-minimal-linux-fedora-x86_64.rpm
          - profile: full
            rpm_flavor: opensuse-tumbleweed
            build_image: opensuse/tumbleweed
            test_targets: opensuse/tumbleweed
            stable_rpm: space-linux-opensuse-tumbleweed-x86_64.rpm
          - profile: minimal
            rpm_flavor: opensuse-tumbleweed
            build_image: opensuse/tumbleweed
            test_targets: opensuse/tumbleweed
            stable_rpm: space-minimal-linux-opensuse-tumbleweed-x86_64.rpm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache-rpm-${{ matrix.rpm_flavor }}
          key: ccache-${{ runner.os }}-rpm-${{ matrix.rpm_flavor }}-${{ matrix.profile }}-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'scripts/build-linux.sh', 'scripts/build-appimage.sh', 'Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-rpm-${{ matrix.rpm_flavor }}-${{ matrix.profile }}-${{ github.ref }}-
            ccache-${{ runner.os }}-rpm-${{ matrix.rpm_flavor }}-${{ matrix.profile }}-
            ccache-${{ runner.os }}-rpm-

      - name: Build RPM on distro baseline
        run: |
          docker run --rm \
            -e PROFILE="${{ matrix.profile }}" \
            -e RPM_FLAVOR="${{ matrix.rpm_flavor }}" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache \
            -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -e CCACHE_DIR="/work/.ccache-rpm-${{ matrix.rpm_flavor }}" \
            -e CCACHE_MAXSIZE=1G \
            -v "$PWD:/work" \
            -w /work \
            "${{ matrix.build_image }}" \
            bash -lc '
              set -euo pipefail
              mkdir -p "${CCACHE_DIR}"
              case "${RPM_FLAVOR}" in
                fedora)
                  dnf install -y --setopt=install_weak_deps=False \
                    cmake \
                    gcc-c++ \
                    make \
                    git \
                    pkgconf-pkg-config \
                    rpm-build \
                    ccache \
                    bzip2 \
                    tar \
                    bullet-devel \
                    glm-devel \
                    openal-soft-devel \
                    libepoxy-devel \
                    portaudio-devel \
                    libvterm-devel \
                    libnotify-devel \
                    libcurl-devel \
                    zeromq-devel \
                    python3 \
                    python3-pillow \
                    python3-zmq \
                    cargo \
                    aubio-devel \
                    boost-devel \
                    xapian-core-devel \
                    rb_libtorrent-devel \
                    ripgrep \
                    ffmpeg-free \
                    ffmpeg-free-devel \
                    libgccjit-devel \
                    libsecret-devel \
                    libdecor-devel \
                    wayland-devel \
                    mesa-libEGL-devel \
                    mesa-libGL-devel \
                    libxkbcommon-devel \
                    libXi-devel \
                    libpng-devel
                  ;;
                opensuse-tumbleweed)
                  zypper -n refresh
                  zypper -n install --no-recommends \
                    cmake \
                    gcc-c++ \
                    make \
                    git \
                    pkgconf \
                    rpm-build \
                    ccache \
                    bzip2 \
                    tar \
                    libbullet-devel \
                    glm-devel \
                    openal-soft-devel \
                    libepoxy-devel \
                    portaudio-devel \
                    libvterm-devel \
                    libnotify-devel \
                    libcurl-devel \
                    zeromq-devel \
                    python3 \
                    python3-Pillow \
                    python3-pyzmq \
                    cargo \
                    libaubio-devel \
                    boost-devel \
                    libxapian-devel \
                    libtorrent-rasterbar-devel \
                    ripgrep \
                    ffmpeg-7-libavcodec-devel \
                    ffmpeg-7-libavformat-devel \
                    ffmpeg-7-libavutil-devel \
                    ffmpeg-7-libswscale-devel \
                    ffmpeg-7-libswresample-devel \
                    libgccjit-devel \
                    libsecret-devel \
                    libdecor-devel \
                    wayland-devel \
                    Mesa-libEGL-devel \
                    Mesa-libGL-devel \
                    libxkbcommon-devel \
                    libXi-devel \
                    libpng16-devel
                  ;;
                *)
                  echo "unknown RPM flavor: ${RPM_FLAVOR}" >&2
                  exit 1
                  ;;
              esac
              git config --global --add safe.directory /work
              scripts/build-linux.sh \
                --profile "${PROFILE}" \
                --build-dir "build/rpm-${RPM_FLAVOR}-${PROFILE}" \
                --package-mode rpm \
                --rpm-flavor "${RPM_FLAVOR}"
              ccache -s
              chown -R "${HOST_UID}:${HOST_GID}" "build/rpm-${RPM_FLAVOR}-${PROFILE}" "${CCACHE_DIR}"
            '

      - name: Smoke test RPM install
        run: |
          for image in ${{ matrix.test_targets }}; do
            docker run --rm \
              -e RPM_NAME="${{ matrix.stable_rpm }}" \
              -e RPM_FLAVOR="${{ matrix.rpm_flavor }}" \
              -e PROFILE="${{ matrix.profile }}" \
              -e SPACE_RELEASE_HEADLESS_SMOKE_MODULE="${SPACE_RELEASE_HEADLESS_SMOKE_MODULE}" \
              -e SPACE_RELEASE_CEF_SMOKE_MODULE="${SPACE_RELEASE_CEF_SMOKE_MODULE}" \
              -v "$PWD/build/rpm-${{ matrix.rpm_flavor }}-${{ matrix.profile }}:/work:ro" \
              "$image" \
              bash -lc '
                set -euo pipefail
                case "${RPM_FLAVOR}" in
                  fedora)
                    if [[ "${PROFILE}" == "full" ]]; then
                      dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb
                    fi
                    dnf install -y --setopt=install_weak_deps=False "/work/${RPM_NAME}"
                    ;;
                  opensuse-tumbleweed)
                    zypper -n refresh
                    if [[ "${PROFILE}" == "full" ]]; then
                      zypper -n install --no-recommends xorg-x11-server-extra || \
                        zypper -n install --no-recommends xorg-x11-server-Xvfb
                    fi
                    zypper -n install --no-recommends --allow-unsigned-rpm "/work/${RPM_NAME}"
                    ;;
                  *)
                    echo "unknown RPM flavor: ${RPM_FLAVOR}" >&2
                    exit 1
                    ;;
                esac
                if [[ "${PROFILE}" == "full" ]]; then
                  test -x /usr/bin/space_cef_helper
                  test -f /usr/lib/space/cef/libcef.so
                  test -f /usr/lib/space/cef/libEGL.so
                  test -f /usr/lib/space/cef/libGLESv2.so
                  test -f /usr/lib/space/cef/libvk_swiftshader.so
                  test -f /usr/lib/space/cef/libvulkan.so.1
                  test -f /usr/lib/space/cef/vk_swiftshader_icd.json
                  test -f /usr/lib/space/cef/icudtl.dat
                  test -f /usr/lib/space/cef/chrome_100_percent.pak
                  test -f /usr/lib/space/cef/chrome_200_percent.pak
                  test -f /usr/lib/space/cef/resources.pak
                  test -f /usr/lib/space/cef/v8_context_snapshot.bin
                  test -d /usr/lib/space/cef/locales
                  Xvfb :99 -screen 0 1024x768x24 >/tmp/space-xvfb.log 2>&1 &
                  xvfb_pid="$!"
                  trap '\''kill "${xvfb_pid}"'\'' EXIT
                  sleep 1
                  timeout 30s env DISPLAY=:99 SPACE_DISABLE_AUDIO=1 space -m "${SPACE_RELEASE_CEF_SMOKE_MODULE}"
                  kill "${xvfb_pid}"
                  trap - EXIT
                else
                  test ! -e /usr/bin/space_cef_helper
                  test ! -e /usr/lib/space/cef
                  test ! -e /usr/lib/libcef.so
                  timeout 30s env SPACE_DISABLE_AUDIO=1 SPACE_SKIP_CEF=1 space -m "${SPACE_RELEASE_HEADLESS_SMOKE_MODULE}"
                fi
              '
          done

      - name: Resolve RPM release artifact
        id: rpm-release-artifacts
        run: |
          manifest="build/rpm-${{ matrix.rpm_flavor }}-${{ matrix.profile }}/release-artifacts-${{ matrix.profile }}.txt"
          test -f "${manifest}"
          {
            echo 'files<<EOF'
            cat "${manifest}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Verify RPM release artifact
        run: |
          manifest="build/rpm-${{ matrix.rpm_flavor }}-${{ matrix.profile }}/release-artifacts-${{ matrix.profile }}.txt"
          test -f "${manifest}"
          while IFS= read -r artifact; do
            test -n "${artifact}"
            test -f "${artifact}"
          done < "${manifest}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ${{ steps.rpm-release-artifacts.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
