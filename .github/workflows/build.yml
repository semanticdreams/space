name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            stable_appimage: space-linux-x86_64.AppImage
            release_files: |
              build/*.deb
              build/*.rpm
              build/*.AppImage
              build/dist/space-linux-x86_64-bin.tar.gz
          - profile: minimal
            stable_appimage: space-minimal-linux-x86_64.AppImage
            release_files: |
              build/space-minimal-linux-amd64.deb
              build/space-minimal-linux-x86_64.rpm
              build/space-minimal-linux-x86_64.AppImage
              build/dist/space-minimal-linux-x86_64-bin.tar.gz
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-linux-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'scripts/build-linux.sh', 'scripts/build-appimage.sh', 'Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-linux-${{ github.ref }}-
            ccache-${{ runner.os }}-linux-
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          deps=$(awk '/CI_DEPS_START/{flag=1;next}/CI_DEPS_END/{flag=0}flag' README.md | sed -n 's/^sudo apt install //p')
          sudo apt-get install -y ${deps} ccache rpm

      - name: Configure and Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/build-linux.sh --profile ${{ matrix.profile }}

      - name: Smoke test AppImage (host)
        run: |
          appimage="$(realpath "build/${{ matrix.stable_appimage }}")"
          test -n "${appimage}"
          test -f "${appimage}"
          chmod +x "${appimage}"
          APPIMAGE_EXTRACT_AND_RUN=1 "${appimage}" --help >/dev/null
          rm -rf /tmp/space-appimage-smoke
          mkdir -p /tmp/space-appimage-smoke
          (
            cd /tmp/space-appimage-smoke
            "${appimage}" --appimage-extract >/dev/null
            test -x squashfs-root/AppRun
            test -x squashfs-root/usr/bin/space
            test -f squashfs-root/usr/share/space/assets/lua/main.fnl
          )

      - name: Smoke test AppImage (Ubuntu 22.04/24.04)
        run: |
          appimage="${{ matrix.stable_appimage }}"
          for image in ubuntu:22.04 ubuntu:24.04; do
            docker run --rm \
              -e APPIMAGE_NAME="${appimage}" \
              -v "$PWD/build:/work" \
              "${image}" bash -lc '
              set -euo pipefail
              rm -rf /tmp/appimage-check
              mkdir -p /tmp/appimage-check
              cd /tmp/appimage-check
              "/work/${APPIMAGE_NAME}" --appimage-extract >/dev/null
              test -x squashfs-root/AppRun
              test -x squashfs-root/usr/bin/space
              test -f squashfs-root/usr/share/space/assets/lua/main.fnl
            '
          done

      - name: ccache stats
        run: ccache -s

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ${{ matrix.release_files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-windows
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache-windows
          key: ccache-${{ runner.os }}-windows-cross-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'scripts/build-windows.sh', 'scripts/build-windows-from-linux.sh', 'scripts/setup-windows-build-host.sh', 'scripts/prepare-windows-runtime.sh', 'scripts/prepare-windows-wine-runtime.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-windows-cross-${{ github.ref }}-
            ccache-${{ runner.os }}-windows-cross-

      - name: Setup Windows cross-build host
        run: scripts/setup-windows-build-host.sh

      - name: Configure and Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/build-windows-from-linux.sh

      - name: Prepare runtime and bundle artifacts
        run: scripts/package-windows-runtime.sh

      - name: Smoke test Windows binary
        run: |
          scripts/prepare-windows-wine-runtime.sh build/windows/space.exe
          test -f dist/windows/space.exe
          timeout 60s wine64 build/windows/space.exe --help >/dev/null

      - name: Create ZIP
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path("dist/windows")
          with zipfile.ZipFile("space-windows.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  archive.write(path, path.relative_to(root))
          PY

      - name: ccache stats
        run: ccache -s

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: space-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
