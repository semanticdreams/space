name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            stable_appimage: space-linux-x86_64.AppImage
            release_files: |
              build/*.deb
              build/*.rpm
              build/*.AppImage
              build/space-linux-amd64.deb
              build/space-linux-x86_64.rpm
              build/space-linux-x86_64.AppImage
              build/dist/space-linux-x86_64-bin.tar.gz
          - profile: minimal
            stable_appimage: space-minimal-linux-x86_64.AppImage
            release_files: |
              build/space-minimal-linux-amd64.deb
              build/space-minimal-linux-x86_64.rpm
              build/space-minimal-linux-x86_64.AppImage
              build/dist/space-minimal-linux-x86_64-bin.tar.gz
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ matrix.profile }}-${{ github.ref }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'scripts/build-linux.sh', 'scripts/build-appimage.sh', 'Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.profile }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ matrix.profile }}-
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          deps=$(awk '/CI_DEPS_START/{flag=1;next}/CI_DEPS_END/{flag=0}flag' README.md | sed -n 's/^sudo apt install //p')
          sudo apt-get install -y ${deps} ccache rpm

      - name: Configure and Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/build-linux.sh --profile ${{ matrix.profile }}

      - name: Smoke test AppImage (host)
        run: |
          appimage="$(realpath "build/${{ matrix.stable_appimage }}")"
          test -n "${appimage}"
          test -f "${appimage}"
          chmod +x "${appimage}"
          APPIMAGE_EXTRACT_AND_RUN=1 "${appimage}" --help >/dev/null
          rm -rf /tmp/space-appimage-smoke
          mkdir -p /tmp/space-appimage-smoke
          (
            cd /tmp/space-appimage-smoke
            "${appimage}" --appimage-extract >/dev/null
            test -x squashfs-root/AppRun
            test -x squashfs-root/usr/bin/space
            test -f squashfs-root/usr/share/space/assets/lua/main.fnl
          )

      - name: Smoke test AppImage (Ubuntu 22.04/24.04)
        run: |
          appimage="${{ matrix.stable_appimage }}"
          for image in ubuntu:22.04 ubuntu:24.04; do
            docker run --rm \
              -e APPIMAGE_NAME="${appimage}" \
              -v "$PWD/build:/work" \
              "${image}" bash -lc '
              set -euo pipefail
              rm -rf /tmp/appimage-check
              mkdir -p /tmp/appimage-check
              cd /tmp/appimage-check
              "/work/${APPIMAGE_NAME}" --appimage-extract >/dev/null
              test -x squashfs-root/AppRun
              test -x squashfs-root/usr/bin/space
              test -f squashfs-root/usr/share/space/assets/lua/main.fnl
            '
          done

      - name: ccache stats
        run: ccache -s

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ${{ matrix.release_files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    if: ${{ false }} # Temporarily disabled; keep job definition for future re-enable.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-curl
            git

      - name: Install vcpkg
        shell: msys2 {0}
        run: |
          git clone https://github.com/microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure and Build
        shell: msys2 {0}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_TARGET_TRIPLET: x64-mingw
        run: scripts/build-windows.sh

      - name: Bundle runtime DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/windows/space.exe dist/
          cp -r assets dist/assets
          cp vcpkg/installed/x64-mingw/bin/*.dll dist/
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/
          cp /mingw64/bin/libstdc++-6.dll dist/
          cp /mingw64/bin/libwinpthread-1.dll dist/

      - name: Create ZIP
        run: powershell Compress-Archive -Path dist\* -DestinationPath space-windows.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: space-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
