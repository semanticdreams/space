name: Setup Windows MinGW Environment
description: Setup MSYS2 MinGW toolchain, ensure posix aliases, and bootstrap vcpkg.

inputs:
  vcpkg-root:
    description: Path where vcpkg should be installed.
    required: true

runs:
  using: composite
  steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-ccache
          git

    - name: Ensure prefixed MinGW bin names
      shell: pwsh
      run: |
        $binDir = Join-Path $env:RUNNER_TEMP 'msys64\mingw64\bin'
        $toolNames = @('ar', 'dlltool', 'nm', 'ranlib', 'strip', 'windres')
        foreach ($toolName in $toolNames) {
          $prefixedPath = Join-Path $binDir "x86_64-w64-mingw32-$toolName.exe"
          if (Test-Path $prefixedPath) {
            continue
          }

          $plainPath = Join-Path $binDir "$toolName.exe"
          if (Test-Path $plainPath) {
            Copy-Item $plainPath $prefixedPath
          }
        }

    - name: Install vcpkg
      shell: msys2 {0}
      run: |
        if [ ! -d "${{ inputs.vcpkg-root }}" ]; then
          git clone https://github.com/microsoft/vcpkg "${{ inputs.vcpkg-root }}"
        fi
        "${{ inputs.vcpkg-root }}/bootstrap-vcpkg.sh"
