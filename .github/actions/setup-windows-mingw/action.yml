name: Setup Windows MinGW Environment
description: Setup MSYS2 MinGW toolchain, ensure posix aliases, and bootstrap vcpkg.

inputs:
  vcpkg-root:
    description: Path where vcpkg should be installed.
    required: true

runs:
  using: composite
  steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-ccache
          git

    - name: Ensure MinGW posix compiler aliases
      shell: msys2 {0}
      run: |
        gcc_src="$(command -v x86_64-w64-mingw32-gcc.exe || command -v x86_64-w64-mingw32-gcc)"
        gxx_src="$(command -v x86_64-w64-mingw32-g++.exe || command -v x86_64-w64-mingw32-g++)"
        windres_src="$(command -v x86_64-w64-mingw32-windres.exe || command -v x86_64-w64-mingw32-windres)"
        if [ ! -f /mingw64/bin/x86_64-w64-mingw32-gcc-posix.exe ]; then
          cp -f "${gcc_src}" /mingw64/bin/x86_64-w64-mingw32-gcc-posix.exe
        fi
        if [ ! -f /mingw64/bin/x86_64-w64-mingw32-g++-posix.exe ]; then
          cp -f "${gxx_src}" /mingw64/bin/x86_64-w64-mingw32-g++-posix.exe
        fi
        if [ ! -f /mingw64/bin/x86_64-w64-mingw32-windres.exe ]; then
          cp -f "${windres_src}" /mingw64/bin/x86_64-w64-mingw32-windres.exe
        fi

    - name: Install vcpkg
      shell: msys2 {0}
      run: |
        if [ ! -d "${{ inputs.vcpkg-root }}" ]; then
          git clone https://github.com/microsoft/vcpkg "${{ inputs.vcpkg-root }}"
        fi
        "${{ inputs.vcpkg-root }}/bootstrap-vcpkg.sh"
